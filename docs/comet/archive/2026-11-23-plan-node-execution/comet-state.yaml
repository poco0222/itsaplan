acceptance:
  - id: A1
    source: brief.md
    text: A user can open a built-in plan, see its nodes, and expand a node to open
      its execution tasks. Creating a node in a plan and adding an execution
      task under it use the same hierarchy. An execution task appears with its
      node when the node changes plans.
    result: passed
    reason:
      text: Chrome showed a node and its nested execution item, and the creation form
        selected the node type and plan. The API created a node and child, then
        moved the node to another plan and returned the child under the same
        node in the destination plan.
      truncated: false
  - id: A2
    source: brief.md
    text: The plan list and detail report 58 percent for a completed node weighted
      30 percent and a node at 40 percent weighted 70 percent. Edits and reopens
      refresh the result. Canceled nodes are excluded. Empty groups and invalid
      weights or unavailable child progress show an unavailable result and the
      relevant reason.
    result: passed
    reason:
      text: The list and detail display 58%. Tests exercised edits, reopening,
        cancellation, empty groups, unallocated weights and an unavailable child
        percentage. The translated unavailable reason rendered in Web tests.
      truncated: false
  - id: A3
    source: brief.md
    text: Node and execution progress entry, weighted node rollup, and status
      changes follow the existing rules. A plan can be marked complete through
      its standard status action after delivery.
    result: passed
    reason:
      text: An incomplete execution task at 100% did not complete its node. Marking it
        completed rolled up the node, reopening reopened the node, and the
        native plan status action completed the plan. Legacy lifecycle tests
        passed.
      truncated: false
  - id: A4
    source: brief.md
    text: A migration of the planning snapshot creates four plans, relinks 13 nodes,
      preserves the 15 execution task parent links, and archives the four source
      modules. Plan title, description, status and planned date reflect the
      source. Work item IDs, existing statuses, status history, field values,
      and attachments remain accessible. Each plan links to its archived source
      module.
    result: passed
    reason:
      text: The test fixture migrated 4 modules, 13 nodes and 15 execution tasks. It
        retained issue IDs, statuses, status history, original
        parent-to-execution links, numeric fields and attachment metadata and
        URLs. The resulting plans carried over module metadata and linked to
        their original records. Chrome opened an archived source with its
        history.
      truncated: false
  - id: A5
    source: brief.md
    text: Preview leaves project data intact. An unsuccessful apply has no partial
      effect, and rerunning a successful migration creates no duplicates. Other
      projects retain their current behavior.
    result: passed
    reason:
      text: Preview preserved the fixture data. A late database constraint error
        rolled back plan creation, relinking and archive changes. Repeat apply
        yielded no duplicate plan. The project scope and legacy behavior passed
        across the API regression checks.
      truncated: false
