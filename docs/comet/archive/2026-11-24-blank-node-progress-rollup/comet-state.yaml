  - id: A1
    source: brief.md
    text: Three nodes without contributing execution tasks, with blank progress and
      weights of 40%, 40%, and 20%, give the plan 0%. The plan list, plan
      detail, and table group header show 0%. Each node keeps an empty editable
      field and shows 0% as its calculated progress.
    result: passed
    reason:
      text: The PostgreSQL-backed regression returns 0% for three blank nodes at
        weights 40/40/20 in the plan list, plan detail and table summary
        endpoint. Node detail returns effective 0%, a null saved value and an
        editable progress field. The table zero rendering test passed, and the
        shared Plans and node formatters handle numeric zero as a value.
      truncated: false
  - id: A2
    source: brief.md
    text: Setting the 40%-weighted node's progress to 25% gives the plan 10%.
      Marking a blank 40%-weighted node completed gives the plan 40% when the
      remaining nodes are at 0%.
    result: passed
    reason:
      text: The regression confirms 40% after marking a blank node with weight 40
        completed, 0% after reopening it and 10% after entering 25% manually.
      truncated: false
  - id: A3
    source: brief.md
    text: A plan without contributing nodes, an invalid node weight allocation, or a
      node whose execution progress cannot be calculated still shows its
      corresponding unavailability reason.
    result: passed
    reason:
      text: Delivery integration tests preserve the reasons for an empty plan, invalid
        allocation and a child rollup unavailable due to invalid execution
        weights. Legacy nodes with blank progress retain their existing
        behavior.
      truncated: false
