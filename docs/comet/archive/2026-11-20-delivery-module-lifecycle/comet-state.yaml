                            'id': 'A1',
                            'source': 'specs/delivery-module-lifecycle/spec.md',
                            'text': 'A project can explicitly bind four distinct work item roles and reusable numeric fields. The module contains delivery nodes and maintenance items directly, and delivery nodes contain execution tasks. Existing records can be attached explicitly with their data preserved. Projects without configuration keep standard behavior.',
                          },
                          {
                            'id': 'A2',
                            'source': 'specs/delivery-module-lifecycle/spec.md',
                            'text': 'The work item workflow shows effective progress from both weighted levels. Open execution tasks use the entered value or zero, completed work contributes 100 percent, and delivery nodes with no contributing tasks allow manual progress. Weight groups require values summing to exactly 100 percent, and invalid groups visibly propagate unavailable progress.',
                          },
                          {
                            'id': 'A3',
                            'source': 'specs/delivery-module-lifecycle/spec.md',
                            'text': 'Canceled records remain accessible and exit the calculation and completion gates. A parent with contributing children completes only when each child is completed and weights are valid, including after weight redistribution. Before handoff, reopening a completed execution task moves its completed node and module into In progress and recalculates their progress.',
                          },
                          {
                            'id': 'A4',
                            'source': 'specs/delivery-module-lifecycle/spec.md',
                            'text': 'A permitted user can transfer the whole module to maintenance only after delivery completion. The activity records who confirmed and when, repeated confirmations create one handoff, and active handoff protects the delivery result. Maintenance items remain under the module and are excluded from delivery metrics.',
                          },
                          {
                            'id': 'A5',
                            'source': 'specs/delivery-module-lifecycle/spec.md',
                            'text': 'An authorized reversal with a reason records the actor, time and reason, restores the delivery phase and preserves prior handoffs and existing maintenance items.',
                          },
                          {
                            'id': 'A6',
                            'source': 'specs/delivery-module-lifecycle/spec.md',
                            'text': 'Planned due dates stay separate from the system completion period. Identified legacy imports remain completed with an unknown effective completion date, count in completion totals and stay out of date comparisons. A genuine completion after reopening uses the new timestamp.',
                          },
                          {
                            'id': 'A7',
                            'source': 'brief.md',
                            'text': 'Work item and workflow permissions are enforced server-side for setup, writes, handoff and reversal. Concurrent edits and phase changes keep eligibility, progress and recorded actions consistent. Verification uses test data and preserves the current weekly report contract and saved reports.',
                          },
