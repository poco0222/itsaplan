acceptance:
  - id: A1
    source: specs/delivery-module-lifecycle/spec.md
    text: A project can explicitly bind four distinct work item roles and reusable
      numeric fields. The module contains delivery nodes and maintenance items
      directly, and delivery nodes contain execution tasks. Existing records can
      be attached explicitly with their data preserved. Projects without
      configuration keep standard behavior.
    result: passed
    reason:
      text: A PostgreSQL integration test rejected duplicate bindings and invalid
        parent placement, and attached an existing item with a combined
        parent/type patch while retaining its numeric field. Chrome showed all
        four roles and field bindings. Regression fixtures exercised projects
        without this setting.
      truncated: false
  - id: A2
    source: specs/delivery-module-lifecycle/spec.md
    text: The work item workflow shows effective progress from both weighted levels.
      Open execution tasks use the entered value or zero, completed work
      contributes 100 percent, and delivery nodes with no contributing tasks
      allow manual progress. Weight groups require values summing to exactly 100
      percent, and invalid groups visibly propagate unavailable progress.
    result: passed
    reason:
      text: The database fixture produced 30% for a blank execution rate, 58% for a
        30/70 weighted node and 54.4% after a second manually managed node. An
        80% allocation propagated unavailable progress. Chrome displayed 100% on
        the complete module and the allocation warning on the incomplete module.
      truncated: false
  - id: A3
    source: specs/delivery-module-lifecycle/spec.md
    text: Canceled records remain accessible and exit the calculation and completion
      gates. A parent with contributing children completes only when each child
      is completed and weights are valid, including after weight redistribution.
      Before handoff, reopening a completed execution task moves its completed
      node and module into In progress and recalculates their progress.
    result: passed
    reason:
      text: The cancellation fixture preserved the canceled item, kept both parents
        open pending reallocation and completed them at valid weight. Reopening
        the task then reopened the node and module and recalculated the module
        to the task's entered 50%. The baseline subtask and status-history suite
        passed.
      truncated: false
  - id: A4
    source: specs/delivery-module-lifecycle/spec.md
    text: A permitted user can transfer the whole module to maintenance only after
      delivery completion. The activity records who confirmed and when, repeated
      confirmations create one handoff, and active handoff protects the delivery
      result. Maintenance items remain under the module and are excluded from
      delivery metrics.
    result: passed
    reason:
      text: The API refused premature handoff, returned the same handoff id to
        concurrent confirmations, allowed a maintenance child, and refused
        attempts to reopen, change a weight, change an occupied status category
        or cascade-delete the active delivery. Chrome showed the phase change
        and audit event.
      truncated: false
  - id: A5
    source: specs/delivery-module-lifecycle/spec.md
    text: An authorized reversal with a reason records the actor, time and reason,
      restores the delivery phase and preserves prior handoffs and existing
      maintenance items.
    result: passed
    reason:
      text: The API rejected a blank reason and returned the module to delivery for an
        authorized reversal. The maintenance issue retained its parent, and
        Chrome showed the original confirmation and the reversal with the
        supplied reason and actor and time.
      truncated: false
  - id: A6
    source: specs/delivery-module-lifecycle/spec.md
    text: Planned due dates stay separate from the system completion period.
      Identified legacy imports remain completed with an unknown effective
      completion date, count in completion totals and stay out of date
      comparisons. A genuine completion after reopening uses the new timestamp.
    result: passed
    reason:
      text: The legacy fixture marked the existing completion period as unknown while
        the original completion state and due date remained. Reopening and
        completing again produced a new visible completion timestamp. The Kanban
        test checked the known-date badge and its absence for unknown dates.
      truncated: false
  - id: A7
    source: brief.md
    text: Work item and workflow permissions are enforced server-side for setup,
      writes, handoff and reversal. Concurrent edits and phase changes keep
      eligibility, progress and recorded actions consistent. Verification uses
      test data and preserves the current weekly report contract and saved
      reports.
    result: passed
    reason:
      text: Owner and restricted-member tests verified the two permission checks. The
        simultaneous handoff and reopen fixture passed with a single permitted
        outcome and consistent phase and progress. The fresh migration,
        weekly-report tests, worker import regressions, source checks and local
        Chrome preview passed.
      truncated: false
