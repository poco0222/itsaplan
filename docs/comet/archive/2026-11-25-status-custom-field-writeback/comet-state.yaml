acceptance:
  - id: A1
    source: brief.md
    text: A user with project status settings access can save and remove number and
      date rules for a selected status. Reloading retains the saved rules.
      Invalid field types, fields from other projects, and unauthorized edits
      are rejected.
    result: passed
    reason:
      text: Chrome saved and reloaded the two rules. PostgreSQL-backed API tests cover
        clearing rules, wrong field type, foreign field, duplicate rule, invalid
        timezone and a 403 for a nonmember.
      truncated: false
  - id: A2
    source: brief.md
    text: After configuring ROLL, moving an eligible item to 已完成 saves `100` and the
      date of the transition in Asia/Taipei. The saved values appear in work
      item details and the custom field API after reload. The weight value is
      preserved.
    result: passed
    reason:
      text: The Chrome test project's item detail showed progress 100, local
        completion date Nov 25, 2026, and unchanged weight 40 after completion.
        API detail independently returned the stored number and date.
      truncated: false
  - id: A3
    source: brief.md
    text: Matching transitions from detail, table, Kanban, API, and the delivery
      workflow apply the same rules. Rejected transitions and edits that retain
      the same status preserve the stored field values.
    result: passed
    reason:
      text: Single and bulk API edits and automatic delivery parent completion
        persisted the configured values. Detail, table and board status edits
        reach the same service and SQL transition. Tests cover rejected managed
        completion and saving an unchanged status. Chrome verified the detail
        transition.
      truncated: false
  - id: A4
    source: brief.md
    text: Reopening a completed item restores its original number, including a blank
      value, and clears the date written by the completion rule. The next
      completion writes its own date. The plan recalculates from the reopened
      item's effective progress.
    result: passed
    reason:
      text: Chrome reopened the item and showed 60 and a blank date. API regressions
        restored both 60 and an initially blank value, refreshed the date on a
        later close, and verified the weighted plan returned to 0% after
        reopening its formerly blank node.
      truncated: false
  - id: A5
    source: brief.md
    text: Enabling a rule leaves existing data as stored until a matching transition
      occurs. Projects without rules retain their current behavior.
    result: passed
    reason:
      text: The no-config delivery and state regressions passed. An issue completed
        before configuration retained both null fields after configuration and a
        same-status edit. The trigger applies only to actual same-project status
        transitions.
      truncated: false
