acceptance:
  - id: A1
    source: brief.md
    text: On an editable numeric custom field in a table, including Completion
      progress and Weight, one click or keyboard activation starts editing and
      focuses the input in that cell. This works for empty and populated cells
      on all three task levels.
    result: passed
    reason:
      text: TableRowSubtasks.test.tsx:401 exercises numeric cells at levels one, two
        and three with both empty values and 75. The first activation mounts the
        input in the original cell and makes it document.activeElement. The
        trigger is a native button so it also supports keyboard activation.
      truncated: false
  - id: A2
    source: brief.md
    text: Enter or the save button commits a valid number. Explicitly saving an
      empty input clears the field. Escape or clicking outside discards the
      draft. The editor uses the existing field mutation and validation without
      opening the task or starting a drag.
    result: passed
    reason:
      text: The table regression verifies blur and Escape send no field updates, Enter
        saves 32.5, the save button clears with null, and row click, pointer and
        keyboard handlers are isolated. InlineTextField.tsx:37 retains the
        finite-number check and the table uses the existing field PUT through
        useSetFieldValue.
      truncated: false
  - id: A3
    source: brief.md
    text: Derived delivery progress and other read-only or unavailable cells remain
      display values. The scope is numeric custom field entry in the table.
    result: passed
    reason:
      text: TableIssueCells.tsx:52 renders derived progress before the editable
        branch, and the inline branch requires both edit permission and a
        matching field scope. The existing static rendering test at
        TableRowSubtasks.test.tsx:225 verifies computed and completed progress
        remain display-only and an editable numeric row retains its trigger.
      truncated: false
