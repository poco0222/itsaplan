acceptance:
  - id: A1
    source: brief.md
    text: With nested subtasks enabled and Default collapsed off, the table shows
      all three levels without any clicks. In nested-only display, third-level
      rows appear once, below and further indented under their own parent, with
      the same configured cells as second-level rows.
    result: passed
    reason:
      text: TableRowSubtasks.test.tsx:18 verifies the default expanded order with the
        third-level issue once beneath its parent, deeper logical padding, and
        the same six configured builtin and custom column values.
        TableSubtaskRow.tsx:38 uses the existing subgrid layout.
      truncated: false
  - id: A2
    source: brief.md
    text: With Default collapsed on, the table initially shows top-level rows in
      nested-only display. Expanding a top-level row reveals its second-level
      rows with their branches folded. For branches with a subtask progress
      count, that control on a second-level row expands or collapses its own
      third-level rows by pointer or keyboard. Collapsing the top-level row
      hides both levels. Changing Default collapsed reapplies the setting to the
      table's subtask branches. Turning off nested subtasks hides the nested
      rows.
    result: passed
    reason:
      text: WorkItemsPage.tsx:273 and BoardLayout.tsx:61 pass the existing
        collapseSubtasks setting. TableRow.tsx:169 renders task branches only
        while the top-level fold is open. The shared fold and table regressions
        verify folded initial state, independent expansion, setting reset, and
        hidden rows when nested subtasks are disabled.
      truncated: false
  - id: A3
    source: brief.md
    text: Selecting a second- or third-level title opens that issue. Activating the
      fold control only changes the branch and does not open an issue or
      initiate dragging.
    result: passed
    reason:
      text: TableRowSubtasks.test.tsx:150 confirms that second- and third-level titles
        open IDs 2 and 4. The toggle changes only its own branch, and click,
        pointer, and native button keyboard events do not reach the parent drag
        or open handlers.
      truncated: false
