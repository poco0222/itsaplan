acceptance:
  - id: A1
    source: brief.md
    text: Applicable progress and weight cells show a percent sign for manual
      values, including zero and decimals, and calculated progress uses the
      percentage display. Empty values and unavailable calculated results keep
      the existing marker or workflow message.
    result: passed
    reason:
      text: TableRowSubtasks.test.tsx verifies raw zero and decimal percentages,
        manual progress, computed completion, an empty marker and the workflow
        reason. The API fixture uses different weight bindings for nodes and
        tasks, demonstrating that table formatting can follow the configured
        roles without depending on labels.
      truncated: false
  - id: A2
    source: brief.md
    text: An edited progress or weight value saves once on Enter, blur or clicking
      Save. Saving an empty value clears it, Escape cancels, and invalid input
      or an unchanged value causes no write. The write targets the edited work
      item on root and nested rows.
    result: passed
    reason:
      text: The table interaction test verifies root and nested row mutations, one
        save on Enter plus blur, blur and click save, cancel, and no writes for
        unchanged and outside-range inputs. The Chrome preview additionally
        verified native incomplete numeric drafts, clearing on blur and one
        write per save.
      truncated: false
  - id: A3
    source: brief.md
    text: Read-only and calculated progress cells cannot be edited. Unrelated
      numeric fields and the time estimate editor retain their existing display
      and save behavior.
    result: passed
    reason:
      text: The calculated-progress branch takes precedence, and read-only cells
        display percentages without buttons. The general number fixture still
        renders without a percent unit and cancels on blur. The existing
        estimate and delivery API tests still pass, including workflow locks.
      truncated: false
