acceptance:
  - id: A1
    source: brief.md
    text: In the signed-in Work Items table primarily grouped by Plan, every visible
      plan group header shows a read-only value aligned with the visible bound
      node progress column when collapsed or expanded. Moving or resizing the
      column maintains alignment. Hiding the column hides the summary.
    result: passed
    reason:
      text: Checked the signed-in Work Items table in Chrome. The read-only plan
        progress remains in the configured completion column when expanded or
        collapsed, moves with reordered columns, stays in line after resizing,
        and is absent when the column is hidden.
      truncated: false
  - id: A2
    source: brief.md
    text: The group value matches the whole-plan weighted percentage shown in Plans,
      including 0% and decimals. Nodes at 100% with 30% weight and 84% with 70%
      weight show 88.8%. Filtering out a contributing row leaves the visible
      plan's percentage unchanged. Editing an underlying progress value or
      status refreshes the total in the open table.
    result: passed
    reason:
      text: Chrome showed 88.8% with both eligible nodes and with the completed node
        filtered out, then 93% after changing the editable node from 84% to 90%.
        The PostgreSQL integration test confirmed equality with Plans for 88.8%
        and recalculation after status and progress changes. The header test
        verified 0% and decimals.
      truncated: false
  - id: A3
    source: brief.md
    text: A plan with unavailable progress shows the same calculation reason as
      Plans and no numeric percentage. The No plan group, projects without
      weighted plan progress, and tables with other primary groupings show no
      plan progress summary.
    result: passed
    reason:
      text: Chrome showed the allocation warning and an empty unassigned group. The
        API returned an empty list for a project with the delivery workflow but
        no plan hierarchy and denied non-members. The table enables the query
        and lookup only for primary Plan grouping and eligible signed-in
        readers.
      truncated: false
