      input and save icon within the existing column width. The focused editor
      has a visible focus indicator, the spinner buttons are hidden, and the
      number has room to display.
    result: passed
    reason:
      text: Desktop Chrome rendered the final compact control in light and dark
        themes. The 64px grid track contained the focus outline and integrated
        save button, and -12.5 was fully visible with no native spinner.
      truncated: false
  - id: A2
    source: brief.md
    text: Populated and empty numeric cells on task and subtask rows still focus on
      one activation. Enter and the save icon save the value, explicitly saving
      a blank clears the field, and Escape or clicking outside discards the
      draft.
    result: passed
    reason:
      text: Chrome verified populated and empty focus, Enter and click save, clear,
        Escape and click-outside cancellation. TableRowSubtasks.test.tsx
        verified the normal row branches, row-specific numeric requests and no
        row activation.
      truncated: false
  - id: A3
    source: brief.md
    text: Read-only and calculated numeric cells display their values. Issue details
      and other table editors keep their current appearance and behavior.
    result: passed
    reason:
      text: TableIssueCells checks computed progress, read-only access and field
        applicability before selecting the compact editor.
        TableRowSubtasks.test.tsx covers the read-only and derived display. The
        issue detail caller omits compact; the default classes and behavior are
        equivalent, and the other editor branches are untouched.
      truncated: false
