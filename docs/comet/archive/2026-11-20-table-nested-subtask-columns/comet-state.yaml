acceptance:
  - id: A1
    source: brief.md
    text: With subtasks shown inside their parents in a table, expand a parent. Each
      direct subtask appears beneath that parent with its title indented and its
      cells aligned to the visible headers in their configured order and widths.
    result: passed
    reason:
      text: The actual table showed QA-2 indented under QA-1. Chrome geometry matched
        header and child x positions for cycle and due date, including after a
        71 px cycle-column resize.
      truncated: false
  - id: A2
    source: brief.md
    text: A subtask with a type, estimated time, due date, cycle, status, and a
      populated visible custom field displays its own values. Empty values use
      the table placeholder.
    result: passed
    reason:
      text: The new regression test and Chrome fixture both showed task type, its own
        estimate, status, due date, cycle, and custom progress in selected
        order. Missing fields used dashes.
      truncated: false
  - id: A3
    source: brief.md
    text: Collapsing the parent hides its nested rows, and selecting a nested title
      opens that subtask. The existing separate-row option continues to control
      whether a subtask also appears as a standalone row.
    result: passed
    reason:
      text: In Chrome, collapsing hid both child rows, expanding restored them,
        selecting the child title opened QA-2, and enabling separate rows showed
        standalone child rows.
      truncated: false
