acceptance:
  - id: A1
    source: brief.md
    text: A started card with a visible due date shows the 3-day indicator at zero
      through three days remaining, and the 5-day indicator at four and five
      days remaining. The date is visible and the two indicators never appear
      together.
    result: passed
    reason:
      text: Deadline component tests cover days 0–6. In both isolated Chrome layouts,
        DQA-1 (today) and DQA-2 (day 3) showed only the 3-day badge; DQA-3 (day
        4) and DQA-4 (day 5) showed only the 5-day badge beside the existing
        date.
      truncated: false
  - id: A2
    source: brief.md
    text: A past due date on an open card retains its overdue styling. A missing or
      invalid due date, a date more than five days away, and cards outside the
      started state show no upcoming indicator. An open board updates as the
      browser-local calendar day changes.
    result: passed
    reason:
      text: Chrome showed the original Nov 19 date in red with no upcoming badge and
        no upcoming badge on day 6 or unstarted DQA-10. Component tests cover
        invalid dates and state boundaries; a simulated midnight tick advances
        the browser-local day and the tested rendering transitions.
        IssueCardBody gates all badges on presence of a visible due date.
      truncated: false
  - id: A3
    source: brief.md
    text: A completed card with an actual completion date later than its deadline
      shows the late-completion indicator and the actual date next to its
      deadline. A deadline on October 8 and completion on October 15 should show
      October 15 in the indicator.
    result: passed
    reason:
      text: DQA-7 showed its original Oct 8 date and the badge with actual Oct 15 in
        both Chrome layouts using the configured date field. The focused test
        asserts the pair directly.
      truncated: false
  - id: A4
    source: brief.md
    text: On-time completion, early completion, cancellation and missing or invalid
      dates do not show a late-completion indicator. The system completion time
      is never substituted for the chosen actual date field.
    result: passed
    reason:
      text: Chrome showed no late badge on DQA-9 with a missing date. Component cases
        suppressed same-day, early, invalid, missing, canceled and unconfigured
        values. Only the selected custom-field value is used; system state-entry
        time is excluded.
      truncated: false
  - id: A5
    source: brief.md
    text: The actual date field can be selected from existing date custom fields,
      saved, reloaded and cleared. Missing or invalid selections do not break
      older views. When existing copy flows remap a saved view, the date field
      selection follows the mapped field or is cleared.
    result: passed
    reason:
      text: Chrome selected the existing date field, saved and reloaded with the
        badge, then cleared, saved and reloaded without it. Normalization tests
        cover legacy and malformed values. The isolated API copy and template
        tests check valid remapping and drop missing or non-date fields.
      truncated: false
  - id: A6
    source: brief.md
    text: Verify the indicators in regular and swimlane Kanban cards using test
      records. Card, status, label and date data remain unchanged, and existing
      layout behavior continues to work.
    result: passed
    reason:
      text: The Chrome extension tab verified the indicator, original date and
        retained subtask on both test layouts. The display mutation was confined
        to the test view. Read-back of the disposable task rows matched the
        seed, and the running instance remained on its original image.
      truncated: false
